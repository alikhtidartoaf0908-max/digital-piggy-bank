<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Piggy Bank</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .balance-box { background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    .btn { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; width: 100%; cursor: pointer; font-size: 16px; }
    .btn:disabled { background: #cccccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h2>My Piggy Bank</h2>
    <div class="balance-box">
      <p style="margin: 0; font-size: 14px; color: #555;">Current Balance</p>
      <h1 id="balance" style="margin: 5px 0; color: #28a745;">0.00 ৳</h1>
    </div>

    <button id="withdrawBtn" class="btn" disabled onclick="requestWithdraw()">Withdraw Balance</button>
    <p id="withdrawNotice" style="font-size: 12px; color: #888; text-align: center; margin-top: 10px;">
      Minimum balance required for withdrawal: 105 Taka
    </p>
  </div>

  <script>
    let currentBalance = 0.00; // Updated dynamically from server

    function updateUI() {
      document.getElementById('balance').innerText = currentBalance.toFixed(2) + ' ৳';
      const withdrawBtn = document.getElementById('withdrawBtn');
      if (currentBalance >= 105) {
        withdrawBtn.disabled = false;
      } else {
        withdrawBtn.disabled = true;
      }
    }

    function requestWithdraw() {
      if (confirm("Request withdrawal of 105 Tk? (100 Tk cashout + 5 Tk processing charge)")) {
        alert("Withdrawal request submitted successfully!");
      }
    }

    updateUI();
  </script>
</body>
</html>
